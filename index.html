		}

		}

			margin: 0;

			color: #456982;
		}
		#symbol_toggle {

			height: 1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
		}
		.symbol-toggle {
			position: relative;
			display: block;
			width: 78px;
			height: 40px;
			margin: 0 20px 0 0;
			border-radius: 999px;
			background: #5b89a9;
			box-shadow: inset 0 0 5px #eef3f6aa, 3px 3px 8px #45698277;
			cursor: pointer;
		}
		.symbol-toggle::after {
			content: "#";
			position: absolute;
			top: 4px;
			left: 4px;
			display: grid;
			width: 32px;
			height: 32px;
			place-items: center;
			border-radius: 50%;
			background: #e8f1f6;
			color: #5b89a9;
			font-size: 20px;
			font-weight: bold;
			transition: transform 180ms ease, content 0s 90ms;
		}
		#symbol_toggle:not(:checked) + .symbol-toggle::after {
			content: "♭";
			transform: translateX(38px);
		}
		#guide {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 7px 20px;
			margin: 20px;
			font-size: 16px;
			color: #ffffff;
			border:3.5px solid #ffffff00;
			box-shadow: inset 0 0 0 1px #ffffff, 3px 3px 8px #45698277;
			background: #5b89a9;
		}
		.step {
			font-weight: bold;
			padding: 3px 5px;
			border-bottom: 1.5px solid #ffffff;
			cursor: default;
		}
		#supplement {
			font-size: 13px;
			margin-left: 20px;
		}
		@keyframes guideBlink {
			0%, 100% {
				outline: 3px solid transparent;
			}
			50% {
				outline: 3px solid #5b89a9;
			}
		}
		.blinking {
			animation: guideBlink 0.8s ease-in-out infinite;
		}

			grid-template-rows: auto auto;
			gap: 10px;
			align-items: flex-start;

			text-align: center;

		function getChordRoot(chordName) {
			return chordName.charAt(1) == "#" ? chordName.substring(0, 2) : chordName.charAt(0);
		}
		
		function useFlatNotation() {
			return !document.getElementById("symbol_toggle").checked;
		}
		
		function getDisplayNote(note) {
			var noteIndex = chromaticNotes.indexOf(note);
			return useFlatNotation() && noteIndex != -1 ? flatNotes[noteIndex] : note;
		}
		
		function getDisplayChordName(chordName) {
			var root = getChordRoot(chordName);
			var type = chordName.substring(root.length);
			type = type.replace(/\(♭5\)/g, "<sup>(♭5)</sup>");
			return getDisplayNote(root) + type;
		}
		
		function updateRootLabels() {
			var rootOptions = document.querySelectorAll('#root_select input[name="root"]');
			for (var i = 0; i < rootOptions.length; i++) {
				rootOptions[i].nextElementSibling.innerText = getDisplayNote(rootOptions[i].value);
			}
		}
		
		function updateNotation() {
			updateRootLabels();
			if (recordChord) {
				displayChord(recordChord);
			}
		}
		
		// コードの構成音を計算
		function getChordNotes(chordName) {
			var fingering = chords[chordName];
			if (!fingering) {
				return "";
			}
			var root = getChordRoot(chordName);
			var notes = [];
			for (var string = 0; string < 6; string++) {
				var fret = fingering[string];
				if (fret == -1) {
					continue;
				}
				var openNote = openStrings[string];
				var openIndex = chromaticNotes.indexOf(openNote);
				var noteIndex = (openIndex + fret) % 12;
				var note = chromaticNotes[noteIndex];
				if (!notes.includes(note)) {
					notes.push(note);
				}
			}
			
			var rootIndex = chromaticNotes.indexOf(root);
			notes.sort(function(a, b) {
				var aIndex = chromaticNotes.indexOf(a);
				var bIndex = chromaticNotes.indexOf(b);
				var aDistance = (aIndex - rootIndex + 12) % 12;
				var bDistance = (bIndex - rootIndex + 12) % 12;
				return aDistance - bDistance;
			});
			return notes.map(getDisplayNote).join("・");
		}

		function basescene(){
			basediv = document.getElementById("guitar_chord");
			basediv.innerHTML = "<img id=\"guitar_fingerboard\" src=\"img/fingerboard.png\" width=\"900\">";
		
			for(var s = 0; s < 6; s++){
				var div = document.createElement("div");
				div.id = "marker_" + s;
				div.style.display = "none";
				basediv.appendChild(div);
			}
		}
		
		var recordChord;
		var playingSounds = [];
		var playbackId = 0;
		var chordVolume = 0.5;
		var audioContext;
		var audioBuffers = {};
		function loadAudioBuffer(filename) {
			if (!audioBuffers[filename]) {
				audioBuffers[filename] = fetch(filename)
					.then(function(response) {
						if (!response.ok) {
							throw new Error("音源を読み込めません: " + filename);
						}
						return response.arrayBuffer();
					})
					.then(function(data) {
						return audioContext.decodeAudioData(data);
					})
					.catch(function(error) {
						delete audioBuffers[filename];
						throw error;
					});
			}
			return audioBuffers[filename];
		}
		function stopChordSound(){
			playbackId++;
			for(var i = 0; i < playingSounds.length; i++){
				try {
					playingSounds[i].stop();
				} catch (error) {
					// すでに停止した音源は無視
				}
			}
			playingSounds = [];
		}
		
		// 選択されたラジオボタンからコードを組み立てる
		function updateChord(){
			var rootOption = document.querySelector('input[name="root"]:checked');
			var typeOption = document.querySelector('input[name="type"]:checked');
			if (!rootOption) {
				stopChordSound();
				clearChordDisplay();
				return;
			}
			var type = typeOption ? typeOption.value : "";
			displayChord(rootOption.value + type);
		}
		
		// コード名を画面に表示
		function displayChord(str){
			stopChordSound();
			clearChordDisplay();
			recordChord = str;  // 選択されたコードを記録
			var chordNotes = getChordNotes(str);
			document.getElementById("chord_name").innerHTML = getDisplayChordName(recordChord) + "　(構成音：" + chordNotes + ")";
			var fingering = chords[str];
			if (!fingering) {
				return;
			}
			for (var s = 0; s < 6; s++) {
				placeMarker(s, fingering[s]);
			}
		}
		// コード表示だけをクリア
		function clearChordDisplay(){
			for(var s = 0; s < 6; s++){
				var div = document.getElementById("marker_" + s);
				if (div) {
					div.style.display = "none";
					div.innerHTML = "";
				}
			}
			document.getElementById("chord_name").innerText = "コードを選択してください";
			recordChord = null;
		}
		
		// 押さえるの弦のマーカーのスタイル
		var style_press = "display:block;position:absolute;z-index:3;width:24px;height:24px;border-radius:50%;background:#5b89a9;"
		// 開放弦のマーカーのスタイル
		var style_open = "display:block;position:absolute;z-index:3;width:24px;height:24px;font-size:20px;"
		
		// マーカーを配置する
		function placeMarker(string, fret){
			var div = document.getElementById("marker_" + string);
			var left = fretX[fret == -1 ? 0 : fret];
			var top = stringY[string];
			if (fret == -1) {
				div.style = style_open + "left:" + left + "px;top:" + top + "px;";
				div.innerHTML = "✕";
			} else if (fret == 0) {
				div.style = style_open + "left:" + left + "px;top:" + top + "px;";
				div.innerHTML = "◯";
			} else {
				div.style = style_press + "left:" + left + "px;top:" + top + "px;";
				div.innerHTML = "";
			}
			div.style.display = "block";
		}
		
		// リセット機能
		function Clear(){
			stopChordSound();
			clearChordDisplay();
			var rootOption = document.querySelector('input[name="root"]:checked');
			if (rootOption) {
				rootOption.checked = false;
			}
			document.querySelector('input[name="type"][value=""]').checked = true;
		}
		
		async function playChord() {
			// コード未選択時にアラート表示
			if (!recordChord) {
				alert("コードを選択してください");
				return;
			}
			stopChordSound();
			var fingering = chords[recordChord];
			if (!fingering) {
				return;
			}
			var currentPlaybackId = playbackId;
			var filenames = [];
			for (var i = 5; i >= 0; i--) {
				var fret = fingering[i];
				if (fret == -1) {  // ミュート弦は再生しない
					continue;
				}
				var stringNumber = i + 1;
				filenames.push("audio/" + stringNumber + "_" + fret + ".wav");
			}
			try {
				if (!audioContext) {
					audioContext = new (window.AudioContext || window.webkitAudioContext)();
				}
				await audioContext.resume();
				var buffers = await Promise.all(filenames.map(loadAudioBuffer));
				if (currentPlaybackId != playbackId) {
					return;
				}
				var startTime = audioContext.currentTime + 0.05;
				for (var j = 0; j < buffers.length; j++) {
					var source = audioContext.createBufferSource();
					var gain = audioContext.createGain();
					source.buffer = buffers[j];
					gain.gain.value = chordVolume;
					source.connect(gain);
					gain.connect(audioContext.destination);
					playingSounds.push(source);
					source.start(startTime + j * 0.06);
				}
			} catch (error) {
				if (currentPlaybackId == playbackId) {
					console.error(error);
					alert("音源を読み込めませんでした。ページを再読み込みしてお試しください。");
				}
			}
		}
		
		// ページ読み込み時に表示
		document.addEventListener('DOMContentLoaded', function() {
			document.getElementById("chord_name").innerText = "コードを選択してください";
			document.getElementById("symbol_toggle").addEventListener("change", updateNotation);
			
			var guideSteps = document.querySelectorAll(".step");
			for (var i = 0; i < guideSteps.length; i++) {
				guideSteps[i].addEventListener("mouseenter", function() {
					var target = document.getElementById(this.dataset.target);
					if (target) {
						target.classList.add("blinking");
					}
				});
				guideSteps[i].addEventListener("mouseleave", function() {
					var target = document.getElementById(this.dataset.target);
					if (target) {
						target.classList.remove("blinking");
					}
				});
			}
			
			updateRootLabels();
		});
	</script>
</head>

<body onload="main();">
	<div class="container">
		<header id="header">
			<div id="header_left">
				<img src="img/logo-header.png" alt="ロゴ" id="header_logo">
				<h1 id="header_title">Guitar Chords App</h1>
			</div>
			<input id="symbol_toggle" type="checkbox" role="switch" checked>
			<label class="symbol-toggle" for="symbol_toggle"></label>
		</header>
		<div id="guide">
			簡単な使い方：
			<span class="step" data-target="root_select">①ルート音を選択</span>
			<span>→</span>
			<span class="step" data-target="type_select">②タイプを選択</span>
			<span>→</span>
			<span class="step" data-target="play_button">③「Play」ボタンを押す</span>
			<span id="supplement">※各項目にマウスを合わせると、操作する場所が点滅します。</span>
			
		</div>
		
		<div id="chord_layout">
			<div id="guitar_chord"></div>
			<fieldset class="chord-options" id="root_select">
				<legend>ルート音</legend>
				<label><input type="radio" name="root" value="C" onchange="updateChord();"><span>C</span></label>
				<label><input type="radio" name="root" value="C#" onchange="updateChord();"><span>C#</span></label>
				<label><input type="radio" name="root" value="D" onchange="updateChord();"><span>D</span></label>
				<label><input type="radio" name="root" value="D#" onchange="updateChord();"><span>D#</span></label>
				<label><input type="radio" name="root" value="E" onchange="updateChord();"><span>E</span></label>
				<label><input type="radio" name="root" value="F" onchange="updateChord();"><span>F</span></label>
				<label><input type="radio" name="root" value="F#" onchange="updateChord();"><span>F#</span></label>
				<label><input type="radio" name="root" value="G" onchange="updateChord();"><span>G</span></label>
				<label><input type="radio" name="root" value="G#" onchange="updateChord();"><span>G#</span></label>
				<label><input type="radio" name="root" value="A" onchange="updateChord();"><span>A</span></label>
				<label><input type="radio" name="root" value="A#" onchange="updateChord();"><span>A#</span></label>
				<label><input type="radio" name="root" value="B" onchange="updateChord();"><span>B</span></label>
			</fieldset>
			<fieldset class="chord-options" id="type_select">
				<legend>タイプ</legend>
				<label><input type="radio" name="type" value="" onchange="updateChord();" checked>M</label>
				<label><input type="radio" name="type" value="m" onchange="updateChord();">m</label>
				<label><input type="radio" name="type" value="M7" onchange="updateChord();">M7</label>
				<label><input type="radio" name="type" value="7" onchange="updateChord();">7</label>
				<label><input type="radio" name="type" value="m7" onchange="updateChord();">m7</label>
				<label><input type="radio" name="type" value="m(♭5)" onchange="updateChord();">m<sup>(♭5)</sup></label>
				<label><input type="radio" name="type" value="m7(♭5)" onchange="updateChord();">m7<sup>(♭5)</sup></label>
				<label><input type="radio" name="type" value="sus4" onchange="updateChord();">sus4</label>
				<label><input type="radio" name="type" value="7sus4" onchange="updateChord();">7sus4</label>
				<label><input type="radio" name="type" value="6" onchange="updateChord();">6</label>
				<label><input type="radio" name="type" value="m6" onchange="updateChord();">m6</label>
				<label><input type="radio" name="type" value="dim7" onchange="updateChord();">dim7</label>
			</fieldset>
			<div id="chord_play">
				<div id="chord_name"></div>
				<button type="button" onclick="playChord();" id="play_button"><img src="img/icon-play.png" alt="">Play</button>
				<button type="button" onclick="Clear();" id="clear_button"><img src="img/icon-clear.png" alt="">Clear</button>
			</div>
		</div>
		<hr>
	</div>
</body>
</html>
